version: '3'

vars:
  COMPOSE: docker-compose
  PIPELINE_DIR: '{{default "./pipeline" .PIPELINE_DIR}}'
  LOGSTASH_SYSLOG_PORT: '{{default "1514" .LOGSTASH_SYSLOG_PORT}}'
  LOGSTASH_SYSLOG_ROUTER_PORT: '{{default "1515" .LOGSTASH_SYSLOG_ROUTER_PORT}}'
  LOGSTASH_SYSLOG_DICT_PORT: '{{default "1516" .LOGSTASH_SYSLOG_DICT_PORT}}'
  LOGSTASH_MYSYSLOG_PORT: '{{default "1517" .LOGSTASH_MYSYSLOG_PORT}}'
  LOGSIM_RATE: '{{default "50" .LOGSIM_RATE}}'
  LOGSIM_DURATION: '{{default "1h" .LOGSIM_DURATION}}'
  LOGSIM: '{{default "git+https://github.com/matthew-hollick/log-simulators" .LOGSIM}}'
  SYSLOG_TIMEZONE:
    sh: 'grep -s "^SYSLOG_TIMEZONE=" .env 2>/dev/null | cut -d= -f2- | tr -d "\n" || echo UTC'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Create .env from .env.example if it does not exist
    cmds:
      - |
        if [ ! -f .env ]; then
          cp .env.example .env
          echo "Created .env from .env.example. Set a secure ELASTIC_PASSWORD before starting the stack."
        else
          echo ".env already exists"
        fi

  start:
    desc: Start the Logstash container in the background
    cmds:
      - '{{.COMPOSE}} up -d'

  stop:
    desc: Stop and remove the Logstash container
    cmds:
      - '{{.COMPOSE}} down'

  restart:
    desc: Restart the Logstash container
    cmds:
      - task stop
      - task start

  logs:
    desc: Tail Logstash container logs
    cmds:
      - '{{.COMPOSE}} logs -f logstash'

  status:
    desc: Show running container status
    cmds:
      - '{{.COMPOSE}} ps --format "{{ "{{.Service}}" }}: {{ "{{.Status}}" }}"'

  validate:
    desc: Validate pipeline configuration without starting the service
    cmds:
      - '{{.COMPOSE}} run --rm logstash bin/logstash --config.test_and_exit'

  wait:
    desc: Wait for the Logstash API to become ready
    cmds:
      - |
        for i in $(seq 1 30); do
          if bash -c 'exec 3<>/dev/tcp/localhost/9600; printf "GET / HTTP/1.0\r\n\r\n" >&3; read -r line <&3; [[ "$line" == *200* ]] && exit 0 || exit 1' 2>/dev/null; then
            echo "Logstash ready"
            exit 0
          fi
          sleep 2
        done
        echo "Logstash did not become ready" >&2
        exit 1

  send:
    desc: Send a test syslog line to the TCP input
    cmds:
      - |
        bash -c 'printf "<14>%s %s: %s\n" "$(TZ="{{.SYSLOG_TIMEZONE}}" date "+%b %e %H:%M:%S")" "logstash-test" "hello from task send" > /dev/tcp/localhost/{{.LOGSTASH_SYSLOG_PORT}}'

  send-mysyslog:
    desc: Send a test syslog line to the mysyslog passthrough port
    cmds:
      - |
        bash -c 'printf "<14>%s %s: %s\n" "$(TZ="{{.SYSLOG_TIMEZONE}}" date "+%b %e %H:%M:%S")" "logstash-test" "hello from mysyslog" > /dev/tcp/localhost/{{.LOGSTASH_MYSYSLOG_PORT}}'

  check-mysyslog:
    desc: Query Elasticsearch for recent documents in logs-mysyslog
    cmds:
      - |
        ELASTIC_PASSWORD=$(grep '^ELASTIC_PASSWORD=' .env | cut -d= -f2-)
        ES_PORT=$(grep '^ES_PORT=' .env | cut -d= -f2-)
        curl --noproxy "*" -s -u "elastic:${ELASTIC_PASSWORD}" "http://127.0.0.1:${ES_PORT:-9200}/logs-mysyslog/_search?size=5&sort=@timestamp:desc&pretty"

  smoke-mysyslog:
    desc: Start Logstash, send a mysyslog event, query the index, print logs, then stop
    cmds:
      - task start
      - task wait
      - task send-mysyslog
      - sleep 5
      - task check-mysyslog
      - '{{.COMPOSE}} logs --tail=20 logstash'
      - task stop

  smoke:
    desc: Start Logstash, send a test syslog event, print the resulting logs, then stop
    cmds:
      - task start
      - task wait
      - task send
      - sleep 3
      - '{{.COMPOSE}} logs --tail=20 logstash'
      - task stop

  logsim-asa:
    desc: Stream Cisco ASA syslog into Logstash via the syslog_router port
    cmds:
      - task start
      - task wait
      - uvx --from '{{.LOGSIM}}' logsim-asa --syslog-header --tz {{.SYSLOG_TIMEZONE}} --output tcp://127.0.0.1:{{.LOGSTASH_SYSLOG_ROUTER_PORT}} --rate {{.LOGSIM_RATE}} --duration {{.LOGSIM_DURATION}}

  logsim-ftd:
    desc: Stream Cisco FTD syslog into Logstash via the syslog_router port
    cmds:
      - task start
      - task wait
      - uvx --from '{{.LOGSIM}}' logsim-ftd --syslog-header --tz {{.SYSLOG_TIMEZONE}} --output tcp://127.0.0.1:{{.LOGSTASH_SYSLOG_ROUTER_PORT}} --rate {{.LOGSIM_RATE}} --duration {{.LOGSIM_DURATION}}

  logsim-syslog:
    desc: Stream Linux syslog into Logstash
    cmds:
      - task start
      - task wait
      - uvx --from '{{.LOGSIM}}' logsim-syslog --tz {{.SYSLOG_TIMEZONE}} --output tcp://127.0.0.1:{{.LOGSTASH_SYSLOG_PORT}} --rate {{.LOGSIM_RATE}} --duration {{.LOGSIM_DURATION}}

  logsim-mysyslog:
    desc: Stream Linux syslog into the raw passthrough port for logs-mysyslog
    cmds:
      - task start
      - task wait
      - uvx --from '{{.LOGSIM}}' logsim-syslog --tz {{.SYSLOG_TIMEZONE}} --output tcp://127.0.0.1:{{.LOGSTASH_MYSYSLOG_PORT}} --rate {{.LOGSIM_RATE}} --duration {{.LOGSIM_DURATION}}

  logsim-windows:
    desc: Continuously stream Windows AD security events into logs-mysyslog
    cmds:
      - task start
      - task wait
      - uvx --from '{{.LOGSIM}}' logsim-windows --output tcp://127.0.0.1:{{.LOGSTASH_MYSYSLOG_PORT}} --rate {{.LOGSIM_RATE}} --count 0

  logsim-windows-elastic:
    desc: Continuously stream Elastic-format Windows events into logs-system.security-default
    cmds:
      - task start
      - task wait
      - uvx --from '{{.LOGSIM}}' logsim-windows --format elastic --output tcp://127.0.0.1:{{.LOGSTASH_WINDOWS_PORT}} --rate {{.LOGSIM_RATE}} --count 0

  build-logsim-runner:
    desc: Build the Docker image used to run simulators inside the logsim network
    cmds:
      - |
        docker build \
          -f config/logsim-runner.Dockerfile \
          -t logstash-logsim-runner \
          config
    status:
      - docker image inspect logstash-logsim-runner >/dev/null 2>&1

  logsim-asa-dict:
    desc: Stream Cisco ASA syslog into the dictionary-routed port from a fixed Docker IP
    deps: [build-logsim-runner]
    cmds:
      - task start
      - task wait
      - |
        docker run --rm --network logsim --ip 172.28.0.11 \
          logstash-logsim-runner \
          uvx --from '{{.LOGSIM}}' logsim-asa \
            --syslog-header --tz {{.SYSLOG_TIMEZONE}} \
            --output tcp://logstash:{{.LOGSTASH_SYSLOG_DICT_PORT}} \
            --rate {{.LOGSIM_RATE}} --duration {{.LOGSIM_DURATION}}

  logsim-ftd-dict:
    desc: Stream Cisco FTD syslog into the dictionary-routed port from a fixed Docker IP
    deps: [build-logsim-runner]
    cmds:
      - task start
      - task wait
      - |
        docker run --rm --network logsim --ip 172.28.0.12 \
          logstash-logsim-runner \
          uvx --from '{{.LOGSIM}}' logsim-ftd \
            --syslog-header --tz {{.SYSLOG_TIMEZONE}} \
            --output tcp://logstash:{{.LOGSTASH_SYSLOG_DICT_PORT}} \
            --rate {{.LOGSIM_RATE}} --duration {{.LOGSIM_DURATION}}

  logsim-ics-dict:
    desc: Stream Cisco IOS-style syslog into the dictionary-routed port from a fixed Docker IP
    deps: [build-logsim-runner]
    cmds:
      - task start
      - task wait
      - |
        docker run --rm --network logsim --ip 172.28.0.13 \
          logstash-logsim-runner \
          uvx --from '{{.LOGSIM}}' logsim-ics \
            --rfc 3164 --tz {{.SYSLOG_TIMEZONE}} \
            --output tcp://logstash:{{.LOGSTASH_SYSLOG_DICT_PORT}} \
            --rate {{.LOGSIM_RATE}} --duration {{.LOGSIM_DURATION}}

  install-integrations:
    desc: Install Elastic integration packages and routing pipeline
    cmds:
      - |
        set -e
        ELASTIC_PASSWORD=$(grep '^ELASTIC_PASSWORD=' .env | cut -d= -f2-)
        KIBANA_PORT=$(grep '^KIBANA_PORT=' .env | cut -d= -f2-)
        ES_PORT=$(grep '^ES_PORT=' .env | cut -d= -f2-)
        KIBANA_URL="http://127.0.0.1:${KIBANA_PORT:-5601}"
        ES_URL="http://127.0.0.1:${ES_PORT:-9200}"
        for i in $(seq 1 60); do
          if curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" "${KIBANA_URL}/api/status" >/dev/null 2>&1; then
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "Kibana did not become ready" >&2
            exit 1
          fi
          sleep 2
        done
        for pkg in "tcp:2.3.1" "syslog_router:1.0.1" "cisco_asa:2.46.0" "cisco_ios:1.36.0" "cisco_ftd:3.13.12" "system:3.0.0"; do
          name="${pkg%%:*}"
          version="${pkg##*:}"
          echo "Installing ${name} @ ${version}"
          curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X POST "${KIBANA_URL}/api/fleet/epm/packages/${name}/${version}" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"force":true}'
        done
        echo "Installing syslog_router routing pipeline"
        curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X PUT "${ES_URL}/_ingest/pipeline/logs-syslog_router.log@custom" -H "Content-Type: application/json" -d @config/syslog_router_routing_pipeline.json

  install-share-workflow:
    desc: Create the 'share' Kibana space, the windows-security-share index, and the scheduled copy workflow
    cmds:
      - |
        set -e
        ELASTIC_PASSWORD=$(grep '^ELASTIC_PASSWORD=' .env | cut -d= -f2-)
        KIBANA_PORT=$(grep '^KIBANA_PORT=' .env | cut -d= -f2-)
        ES_PORT=$(grep '^ES_PORT=' .env | cut -d= -f2-)
        KIBANA_URL="http://127.0.0.1:${KIBANA_PORT:-5601}"
        ES_URL="http://127.0.0.1:${ES_PORT:-9200}"
        for i in $(seq 1 60); do
          if curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" "${KIBANA_URL}/api/status" >/dev/null 2>&1; then
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "Kibana did not become ready" >&2
            exit 1
          fi
          sleep 2
        done
        echo "Creating 'share' Kibana space"
        curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X POST "${KIBANA_URL}/api/spaces/space" -H "kbn-xsrf: true" -H "Content-Type: application/json" \
          -d '{"id":"share","name":"share","description":"Shared data products derived from internal indexes","color":"#54B399","initials":"s"}' \
          || echo "(space may already exist)"
        echo
        echo "Installing windows-security-share-ilm ILM policy"
        curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X PUT "${ES_URL}/_ilm/policy/windows-security-share-ilm" -H "Content-Type: application/json" \
          -d @config/windows-security-share-ilm.json
        echo
        echo "Installing share-default ingest pipeline"
        curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X PUT "${ES_URL}/_ingest/pipeline/share-default" -H "Content-Type: application/json" \
          -d @config/share-default.pipeline.json
        echo
        echo "Installing logs-system.security-share index template"
        curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X PUT "${ES_URL}/_index_template/logs-system.security-share" -H "Content-Type: application/json" \
          -d @config/logs-system.security-share.template.json
        echo
        echo "Creating logs-system.security-share data stream"
        curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X PUT "${ES_URL}/_data_stream/logs-system.security-share" \
          || echo "(data stream may already exist)"
        echo
        if curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" "${KIBANA_URL}/s/share/api/workflows" -H "kbn-xsrf: true" | grep -q '"share-windows-security-events"'; then
          echo "Workflow share-windows-security-events already installed"
        else
          echo "Installing share workflow"
          WF_YAML=$(cat config/workflows/share-windows-security.yaml | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))')
          curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X POST "${KIBANA_URL}/s/share/api/workflows" -H "kbn-xsrf: true" -H "Content-Type: application/json" \
            -d "{\"workflows\":[{\"yaml\":${WF_YAML}}]}"
          echo
        fi
        echo "Run once now:"
        curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X POST "${KIBANA_URL}/s/share/api/workflows/workflow/share-windows-security-events/run" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"inputs":{}}'

  run-share-workflow:
    desc: Trigger the share workflow manually
    cmds:
      - |
        ELASTIC_PASSWORD=$(grep '^ELASTIC_PASSWORD=' .env | cut -d= -f2-)
        KIBANA_PORT=$(grep '^KIBANA_PORT=' .env | cut -d= -f2-)
        curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X POST "http://127.0.0.1:${KIBANA_PORT:-5601}/s/share/api/workflows/workflow/share-windows-security-events/run" -H "kbn-xsrf: true" -H "Content-Type: application/json" -d '{"inputs":{}}'

  install-share-access:
    desc: Create the share_viewer role and share_user account (read-only, share space + *-share indices only)
    cmds:
      - |
        set -e
        ELASTIC_PASSWORD=$(grep '^ELASTIC_PASSWORD=' .env | cut -d= -f2-)
        ES_PORT=$(grep '^ES_PORT=' .env | cut -d= -f2-)
        ES_URL="http://127.0.0.1:${ES_PORT:-9200}"
        echo "Installing share_viewer role"
        curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X PUT "${ES_URL}/_security/role/share_viewer" -H "Content-Type: application/json" -d @config/security/share_viewer.role.json
        echo
        echo "Installing share_user (password: changeme - demo only)"
        curl --noproxy "*" -fs -u "elastic:${ELASTIC_PASSWORD}" -X PUT "${ES_URL}/_security/user/share_user" -H "Content-Type: application/json" -d @config/security/share_user.user.json
        echo

  exec:
    desc: Open an interactive shell inside the running Logstash container
    cmds:
      - '{{.COMPOSE}} exec logstash bash'

  clean:
    desc: Remove container, network, and volumes created by docker-compose
    cmds:
      - '{{.COMPOSE}} down -v'
