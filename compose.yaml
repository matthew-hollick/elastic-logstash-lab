  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION:-9.5.3}
    container_name: logstash-logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=${LS_JAVA_OPTS:--Xms512m -Xmx512m}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "127.0.0.1:${LOGSTASH_SYSLOG_PORT:-1514}:1514"
      - "127.0.0.1:${LOGSTASH_API_PORT:-9600}:9600"
    volumes:
      - ${PIPELINE_DIR:-./pipeline}:/usr/share/logstash/pipeline:ro
      - ./config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - logstash-data:/usr/share/logstash/data
    restart: unless-stopped

volumes:
  es-data:
  kibana-data:
# fleet-server-data:
# fleet-server-config:
  logstash-data:
