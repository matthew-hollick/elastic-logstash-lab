# Add custom filters here.
# Filters are applied in file load order, so keep this between
# the input and output files.

filter {
  if [syslog_router] {
    # Route these events to the Syslog Router data stream. The
    # logs-syslog_router.log@custom ingest pipeline then sets
    # _conf.dataset based on the message content and the integration's
    # default pipeline reroutes to the correct integration data stream.
    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "syslog_router.log"
        "[data_stream][namespace]" => "default"
      }
    }
  }
}
