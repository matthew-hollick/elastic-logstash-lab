# Add custom filters here.
# Filters are applied in file load order, so keep this between
# the input and output files.

filter {
  if [syslog_router] {
    # Route these events to the Syslog Router data stream. The
    # logs-syslog_router.log@custom ingest pipeline then sets
    # _conf.dataset based on the message content and the integration's
    # default pipeline reroutes to the correct integration data stream.
    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "syslog_router.log"
        "[data_stream][namespace]" => "default"
      }
    }
  }

  if [syslog_dict] {
    translate {
      source => "[@metadata][input][tcp][source][ip]"
      target => "[data_stream][dataset]"
      dictionary_path => "/usr/share/logstash/config/syslog-sources.csv"
      fallback => "generic"
    }

    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][namespace]" => "default"
      }
    }

    if [data_stream][dataset] == "generic" {
      mutate { add_tag => ["unmatched_syslog_origin"] }
    }
  }

  # Route Elastic-format Windows Security events to the System
  # integration's system.security data stream. The installed
  # logs-system.security-* pipeline performs the ECS enrichment.
  if [@metadata][windows_security] == "true" {
    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "system.security"
        "[data_stream][namespace]" => "default"
      }
    }
  }
}
