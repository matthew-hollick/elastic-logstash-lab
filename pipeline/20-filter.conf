# Add custom filters here.
# Filters are applied in file load order, so keep this between
# the input and output files.

filter {
  if [syslog_router] {
    # Write to the Syslog Router data stream. Its ingest pipeline will
    # then reroute to the correct integration data stream based on the
    # _conf.dataset field set below.
    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "syslog_router.log"
        "[data_stream][namespace]" => "default"
      }
    }

    # Tag the event so the syslog_router ingest pipeline reroutes it to
    # the matching Cisco integration data stream. Keep more specific
    # patterns (ASA, FTD) before the generic IOS match.
    if [message] =~ /%ASA-/ {
      mutate {
        add_field => {
          "[_conf][dataset]" => "cisco_asa.log"
          "[_conf][tz_offset]" => "UTC"
          "[_temp_][internal_zones]" => ["trust"]
          "[_temp_][external_zones]" => ["untrust"]
        }
      }
    } else if [message] =~ /%FTD-/ {
      mutate {
        add_field => {
          "[_conf][dataset]" => "cisco_ftd.log"
          "[_conf][tz_offset]" => "UTC"
          "[_temp_][internal_zones]" => ["trust"]
          "[_temp_][external_zones]" => ["untrust"]
        }
      }
    } else if [message] =~ /%[A-Za-z]+-[0-9]-[^ :]+:/ {
      mutate {
        add_field => {
          "[_conf][dataset]" => "cisco_ios.log"
          "[_conf][tz_offset]" => "UTC"
        }
      }
    }
  }
}
