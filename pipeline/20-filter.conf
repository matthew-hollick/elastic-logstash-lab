# Add custom filters here.
# Filters are applied in file load order, so keep this between
# the input and output files.

filter {
  if [syslog_router] {
    # Route these events to the Syslog Router data stream. The
    # logs-syslog_router.log@custom ingest pipeline then sets
    # _conf.dataset based on the message content and the integration's
    # default pipeline reroutes to the correct integration data stream.
    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "syslog_router.log"
        "[data_stream][namespace]" => "default"
      }
    }
  }

  if [syslog_dict] {
    # Use the source IP to look up the target integration dataset in the
    # dictionary file. With ECS compatibility enabled (the default), Logstash
    # tcp input stores the source address under [@metadata][input][tcp][source][ip].
    # With ecs_compatibility => disabled it is the legacy host field.
    if [@metadata][input][tcp][source][ip] {
      mutate { add_field => { "[@metadata][source_ip]" => "%{[@metadata][input][tcp][source][ip]}" } }
    } else if [host] {
      mutate { add_field => { "[@metadata][source_ip]" => "%{host}" } }
    }

    translate {
      source => "[@metadata][source_ip]"
      target => "[data_stream][dataset]"
      dictionary_path => "/usr/share/logstash/config/ip_to_integration.csv"
      fallback => ""
    }

    mutate { remove_field => ["[@metadata][source_ip]"] }

    if [data_stream][dataset] and [data_stream][dataset] != "" {
      mutate {
        add_field => {
          "[data_stream][type]" => "logs"
          "[data_stream][namespace]" => "default"
        }
      }
    } else {
      mutate { remove_field => ["[data_stream][dataset]"] }
    }
  }
}
