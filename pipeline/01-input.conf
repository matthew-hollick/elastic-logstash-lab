input {
  syslog {
    port => 1514
    timezone => "${SYSLOG_TIMEZONE:UTC}"
  }

  tcp {
    port => 1515
    add_field => { "syslog_router" => "true" }
  }

  tcp {
    port => 1516
    add_field => { "syslog_dict" => "true" }
  }

  tcp {
    port => 1517
    add_field => { "[@metadata][mysyslog]" => "true" }
  }

  # Elastic Winlog-compatible Windows Security events (logsim-windows
  # --format elastic). Events arrive as pre-parsed JSON; no codec needed
  # beyond decoding each line into fields.
  tcp {
    port => 1518
    codec => json
    add_field => { "[@metadata][windows_security]" => "true" }
  }
}
