input {
  syslog {
    port => 1514
    timezone => "${SYSLOG_TIMEZONE:UTC}"
  }

  tcp {
    port => 1515
    add_field => { "syslog_router" => "true" }
  }

  tcp {
    port => 1516
    add_field => { "syslog_dict" => "true" }
  }

  tcp {
    port => 1517
    add_field => { "[@metadata][mysyslog]" => "true" }
  }
}
